<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4인 끝말잇기</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#dfe4ec;--accent:#315efb;--danger:#e34d59}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1;min-width:180px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #315efb22}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:white;min-height:44px}
button.secondary{background:#edf1f7;color:#263246}button:disabled{opacity:.45;cursor:not-allowed}
.code{font-size:30px;font-weight:800;letter-spacing:5px}.center{text-align:center}
.word{font-size:44px;font-weight:850;min-height:62px;letter-spacing:2px}.next{font-size:14px;color:var(--muted)}
.timer{height:8px;background:#e8ebf1;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;width:100%;background:var(--accent);transition:width .2s linear}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.p{border:1px solid var(--line);border-radius:12px;padding:12px}.p.me{border-color:var(--accent)}.p.dead{opacity:.4}.pname{font-weight:750}.tag{font-size:11px;color:var(--muted);margin-top:4px}
.history{display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow:auto}.chip{background:#f0f2f6;border-radius:8px;padding:6px 9px;font-size:13px}
.msg{min-height:22px;color:var(--muted);font-size:13px;margin-top:9px}.error{color:var(--danger)}
.hidden{display:none!important}
@media(max-width:600px){.players{grid-template-columns:repeat(2,1fr)}.word{font-size:34px}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="top"><div><h1>끝말잇기 · 4인전</h1><div class="sub">최대 4명 / 15초 턴 / 마지막 생존자가 승리</div></div><div id="roomLabel"></div></div>

  <section class="card" id="lobby">
    <div class="row">
      <div class="grow"><label>닉네임</label><input id="name" maxlength="12" placeholder="이름 입력"></div>
      <div class="grow"><label>방 코드</label><input id="code" maxlength="4" placeholder="참가 시 입력"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="create">방 만들기</button><button id="join" class="secondary">방 참가</button>
    </div>
    <div id="lobbyMsg" class="msg"></div>
  </section>

  <section class="card hidden" id="room">
    <div class="center">
      <div class="sub">방 코드</div><div class="code" id="codeView"></div>
      <div class="msg">이 코드를 다른 직원들에게 공유하세요.</div>
    </div>
    <div class="players" id="players" style="margin-top:16px"></div>
    <div class="row" style="margin-top:14px"><button id="start">게임 시작</button><button id="reset" class="secondary">다시 하기</button></div>
  </section>

  <section class="card hidden" id="game">
    <div class="center">
      <div class="sub" id="turnLabel"></div>
      <div class="word" id="current">—</div>
      <div class="next" id="next">첫 단어를 입력하세요</div>
      <div class="timer"><div class="bar" id="bar"></div></div>
    </div>
    <div class="row" style="margin-top:16px">
      <div class="grow"><input id="word" maxlength="20" placeholder="단어 입력" autocomplete="off"></div>
      <button id="submit">제출</button>
    </div>
    <div id="gameMsg" class="msg"></div>
    <div style="margin-top:16px"><div class="sub" style="margin-bottom:7px">사용된 단어</div><div class="history" id="history"></div></div>
  </section>
</main>
<script>
(() => {
  const $=id=>document.getElementById(id);
  let ws=null,myId=null,roomCode="",state=null;
  const lobby=$("lobby"),room=$("room"),game=$("game");

  function connect(){
    const proto=location.protocol==="https:"?"wss":"ws";
    ws=new WebSocket(`${proto}://${location.host}`);
    ws.onopen=()=>setMsg("lobbyMsg","서버 연결 완료","ok");
    ws.onclose=()=>setMsg("lobbyMsg","서버 연결이 끊겼습니다. 페이지를 새로고침해 주세요.","error");
    ws.onmessage=e=>{
      const m=JSON.parse(e.data);
      if(m.type==="joined"){myId=m.id;roomCode=m.code;$("code").value=roomCode;$("codeView").textContent=roomCode;showRoom();}
      if(m.type==="state"){state=m.state;render();}
      if(m.type==="timer"){renderTimer(m.timeLeft);}
      if(m.type==="notice")setMsg("gameMsg",m.message,"ok");
      if(m.type==="error")setMsg(state?"gameMsg":"lobbyMsg",m.message,"error");
    };
  }
  function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x));}
  function setMsg(id,t,kind){const el=$(id);el.textContent=t;el.className="msg "+(kind==="error"?"error":"");}
  function showRoom(){lobby.classList.add("hidden");room.classList.remove("hidden");game.classList.remove("hidden");}
  function render(){
    showRoom();
    $("roomLabel").textContent=state?.code?`ROOM ${state.code}`:"";
    $("codeView").textContent=state.code;
    $("start").disabled=!(state.players[0]?.id===myId&&state.status==="waiting"&&state.players.length>=2);
    $("reset").disabled=state.players[0]?.id!==myId;
    $("start").textContent=state.status==="waiting"?"게임 시작":state.status==="playing"?"진행 중":"게임 종료";
    $("players").innerHTML=state.players.map((p,i)=>{
      const turn=state.turn===p.id&&state.status==="playing";
      return `<div class="p ${p.id===myId?"me":""} ${p.alive?"":"dead"}"><div class="pname">${escapeHtml(p.name)} ${p.id===myId?"(나)":""}</div><div class="tag">${turn?"▶ 현재 턴 · ":""}${p.alive?"생존":"탈락"} · ${p.score}점</div></div>`;
    }).join("");
    $("current").textContent=state.currentWord||"—";
    $("next").textContent=state.currentWord?`다음 단어는 "${state.nextChar}"으로 시작`:"첫 단어를 자유롭게 입력";
    $("history").innerHTML=state.used.map(w=>`<span class="chip">${escapeHtml(w)}</span>`).join("");
    const me=state.players.find(p=>p.id===myId);
    const mine=state.turn===myId&&me?.alive&&state.status==="playing";
    $("turnLabel").textContent=state.status==="waiting"?"대기 중":state.status==="finished"?"게임 종료":mine?"당신의 턴입니다!":"다른 플레이어의 턴입니다.";
    $("word").disabled=!mine;$("submit").disabled=!mine;
    if(state.status==="finished"){
      const winner=state.players.find(p=>p.alive);
      setMsg("gameMsg",winner?`🏆 ${winner.name} 승리!`:"게임 종료","ok");
    } else if(state.status==="waiting"){
      setMsg("gameMsg",state.players.length<2?"다른 플레이어를 기다리는 중…":"방장(첫 참가자)이 게임을 시작하세요.","ok");
    }
    renderTimer(state.timeLeft);
  }
  function renderTimer(left){
    const pct=Math.max(0,Math.min(100,left/15*100));
    $("bar").style.width=pct+"%";
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

  $("create").onclick=()=>{const name=$("name").value.trim();if(!name)return setMsg("lobbyMsg","닉네임을 입력하세요.","error");send({type:"create",name});};
  $("join").onclick=()=>{const name=$("name").value.trim(),code=$("code").value.trim().toUpperCase();if(!name)return setMsg("lobbyMsg","닉네임을 입력하세요.","error");if(code.length!==4)return setMsg("lobbyMsg","4자리 방 코드를 입력하세요.","error");send({type:"join",name,code});};
  $("start").onclick=()=>send({type:"start"});
  $("reset").onclick=()=>send({type:"reset"});
  $("submit").onclick=submit;
  $("word").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
  function submit(){const w=$("word").value.trim();if(!w)return;send({type:"word",word:w});$("word").value="";}

  connect();
})();
</script>
</body>
</html>
